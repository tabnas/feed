[package]
name = "tabnas-feed"
version = "0.6.13"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "RSS and Atom feed plugin for the tabnas parsing engine, normalising every dialect to an Atom shape"
repository = "https://github.com/tabnas/feed"

[lib]
name = "tabnas_feed"
path = "src/lib.rs"

[dependencies]
# The engine and the XML grammar this plugin is layered on are consumed as
# SIBLING CHECKOUTS, the standard tabnas development model: clone
# https://github.com/tabnas/parser and https://github.com/tabnas/xml next
# to this repo. `make`, `make_with` and `parse` build on the engine alone.
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }
tabnas-xml = { path = "../../xml/rs" }
indexmap = "2"
regex = "1.10"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The shared fixture loader and runner: one loader in three languages, so
# the rows mean the same thing in every runtime.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
# The composition test mirrors ts/test/debug-model.test.ts, which asserts
# that this plugin contributes no rules of its own.
tabnas-debug = { path = "../../debug/rs" }
# The relaxed-JSON grammar, for the tests only: they build the parser the
# canonical suites build, `new Tabnas().use(jsonic).use(Feed)`. Clone
# https://github.com/tabnas/jsonic next to this repo; it takes tabnas-json
# from ../../json/rs, so that checkout is needed too.
tabnas-jsonic = { path = "../../jsonic/rs" }
